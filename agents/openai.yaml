  short_description: "Delegate build, verify clean candidate, prove completion"
  default_prompt: "Use $contract-build-prove as coordinator. Reuse a trusted runtime profile when available, freeze required/protected behavior before candidate-affecting edits, prefer one coherent builder with one shared writer total, isolate/integrate the exact candidate, then use a new clean-context verifier that checks contract coverage and attest-tests-re-attests the same artifact. Prefer GPT-5.6 Luna for Codex builders when suitable and especially for final verification."

